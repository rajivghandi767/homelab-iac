name: Deployment Orchestrator

on:
  schedule:
    # Runs at 07:30 UTC (3:30 AM EDT / 2:30 AM EST) Daily
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      TARGET_APP:
        description: 'Target Application to Deploy (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - portfolio-website
          - silicon-valley-trail
          - prop-and-ferry
          - country-trivia-web

jobs:
  orchestrate-deployments:
    name: Orchestrate Deployments
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Run Sequential Deployments
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET: ${{ github.event.inputs.TARGET_APP || 'all' }}
        run: |
          set -e

          dispatch_and_wait() {
            local repo="$1"
            local workflow="$2"
            local max_retries=4
            local delay=5
            local attempt=1

            echo "=================================================="
            echo "🚀 Dispatching $workflow on $repo..."
            echo "=================================================="

            DISPATCH_TIME=$(date -u -d "-10 seconds" +"%Y-%m-%dT%H:%M:%SZ")

            while true; do
              if gh workflow run "$workflow" --repo "${{ github.repository_owner }}/$repo" --ref main; then
                break
              fi
              if [ "$attempt" -ge "$max_retries" ]; then
                echo "❌ Failed to dispatch $workflow on $repo after $max_retries attempts."
                return 1
              fi
              echo "⚠️ Dispatch failed (attempt $attempt/$max_retries). Retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done

            # Poll for the newly registered run (created at or after DISPATCH_TIME)
            RUN_ID=""
            for i in {1..6}; do
              sleep 5
              RUN_ID=$(gh run list --repo "${{ github.repository_owner }}/$repo" --workflow "$workflow" --limit 5 --json databaseId,createdAt --jq "[.[] | select(.createdAt >= \"$DISPATCH_TIME\")][0].databaseId // empty" || true)
              if [ -n "$RUN_ID" ]; then
                break
              fi
              echo "⏳ Waiting for GitHub event ingestion on $repo (check $i/6)..."
            done

            if [ -n "$RUN_ID" ]; then
              echo "⏳ Watching run #$RUN_ID for $repo ($workflow)..."
              gh run watch "$RUN_ID" --repo "${{ github.repository_owner }}/$repo" --exit-status
              echo "✅ Completed $workflow on $repo."
            else
              echo "⚠️ Could not retrieve run ID for $repo after polling. Proceeding..."
            fi
          }

          DAY_OF_WEEK=$(date +%u) # 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat, 7=Sun

          # 1. Portfolio Website
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "portfolio-website" ]; then
            dispatch_and_wait "portfolio-website" "deploy.yml"
          fi

          # 2. Silicon Valley Trail
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "silicon-valley-trail" ]; then
            dispatch_and_wait "silicon-valley-trail" "deploy.yml"
          fi

          # 3. Prop & Ferry
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "prop-and-ferry" ]; then
            dispatch_and_wait "prop-and-ferry" "deploy.yml"

            # Bi-weekly coordinate and live ferry scrapers (Wed=3, Sun=7)
            if [ "$DAY_OF_WEEK" -eq 3 ] || [ "$DAY_OF_WEEK" -eq 7 ]; then
              echo "📅 Bi-weekly schedule matched (Wed/Sun): running fetch_routes and scrape_ferries..."
              dispatch_and_wait "prop-and-ferry" "fetch_routes.yml"
              dispatch_and_wait "prop-and-ferry" "scrape_ferries.yml"
            fi
          fi

          # 4. Country Trivia Web
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "country-trivia-web" ]; then
            dispatch_and_wait "country-trivia-web" "deploy.yml"
            dispatch_and_wait "country-trivia-web" "data_generation.yml"
          fi

          echo "🎉 All deployment checks and scheduled pipelines executed successfully."
